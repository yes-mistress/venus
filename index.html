<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Venus Berlin '26 Zine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&family=Rubik+Mono+One&family=Permanent+Marker&display=swap">
<style>
/* Layout: one photocopied card on the xerox-grey ground holding the password form and, once unlocked, the download. */
:root {
  --ground: #8f8d88; --paper: #efede6; --toner: #141312; --toner-soft: #3b3936; --fluoro: #ff3fa4; --tape: rgba(236, 228, 196, 0.8);
  --f-type: "Special Elite", "Courier Prime", "Courier New", monospace;
  --f-body: "Courier Prime", "Courier New", Courier, monospace;
  --f-block: "Rubik Mono One", "Arial Black", Impact, sans-serif;
  --f-scrawl: "Permanent Marker", "Marker Felt", "Comic Sans MS", cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--toner); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
[hidden] { display: none !important; }

.gate { min-height: 100%; display: grid; place-items: center;
  padding: max(32px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(32px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.card { position: relative; width: min(100%, 440px); background: var(--paper); padding: 40px 32px 32px; transform: rotate(-.8deg);
  box-shadow: 0 1px 0 #0003, 0 14px 30px -12px #0008; display: flex; flex-direction: column; gap: 18px; }
.card::before { content: ""; position: absolute; top: -12px; left: 50%; width: 110px; height: 26px; margin-left: -55px; background: var(--tape); transform: rotate(-3deg); box-shadow: 0 1px 2px #0002; }
.kicker { font-family: var(--f-type); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; margin: 0; }
h1 { margin: 0; font-family: var(--f-block); font-weight: 400; font-size: clamp(40px, 12vw, 58px); line-height: .9; letter-spacing: -.02em; }
h1 .pink { background: var(--fluoro); padding: 0 .08em; display: inline-block; transform: rotate(-2deg); }
.by { margin: 0; font-family: var(--f-scrawl); font-size: 18px; transform: rotate(-2deg); }
form { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
label { font-family: var(--f-type); font-size: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
input { flex: 1 1 180px; min-width: 0; font: 16px var(--f-body); padding: 10px 12px; border: 2px solid var(--toner); background: #fff; color: var(--toner); border-radius: 0; }
button, .btn { font-family: var(--f-block); font-size: 13px; letter-spacing: .04em; padding: 11px 16px; border: 2px solid var(--toner); background: var(--fluoro); color: var(--toner);
  box-shadow: 3px 3px 0 var(--toner); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
button:active, .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--toner); }
button:disabled { opacity: .6; cursor: progress; }
input:focus-visible, button:focus-visible, .btn:focus-visible { outline: 3px solid var(--fluoro); outline-offset: 2px; }
.msg { font-family: var(--f-type); font-size: 14px; min-height: 1.4em; margin: 0; }
.msg.err { color: #a3004f; }
.done { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.btn.alt { background: var(--paper); }
.reader { display: flex; flex-direction: column; height: 100%; }
.bar { background: var(--paper); border-bottom: 3px double var(--toner); display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
  padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.bar .title { font-family: var(--f-block); font-size: 15px; margin-right: auto; }
.bar .btn { font-size: 11px; padding: 8px 12px; }
iframe { flex: 1; width: 100%; border: 0; background: var(--ground); }

@media (prefers-reduced-motion: reduce) { button:active, .btn:active { transform: none; } }
</style>
</head>
<body>

<main class="gate" id="gate">
  <div class="card">
    <p class="kicker">Field report &middot; Oct 2026</p>
    <h1>VENUS<br>BERLIN <span class="pink">'26</span></h1>
    <p class="by">by Clare Carmody</p>
    <form id="form" autocomplete="off">
      <label for="pw">Enter the password to read the zine online or download the PDF.</label>
      <div class="row">
        <input id="pw" name="pw" type="password" autocomplete="current-password" required>
        <button id="go" type="submit">Unlock</button>
      </div>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
    <div class="done" id="done" hidden>
      <p class="msg">Unlocked.</p>
      <div class="row">
        <button class="btn" id="read" type="button">Read it online</button>
        <button class="btn alt" id="dl" type="button">Download the PDF</button>
      </div>
    </div>
  </div>
</main>

<div class="reader" id="reader" hidden>
  <div class="bar">
    <span class="title">VENUS BERLIN '26</span>
    <button class="btn" id="dl2" type="button">Download the PDF</button>
  </div>
  <iframe id="zine" title="Venus Berlin '26 zine"></iframe>
</div>
<script>
(() => {
  const form = document.getElementById('form');
  const pw = document.getElementById('pw');
  const go = document.getElementById('go');
  const msg = document.getElementById('msg');
  let key = null;

  async function deriveKey(password) {
    const p = await (await fetch('params.json', { cache: 'no-store' })).json();
    const salt = new Uint8Array(p.salt.match(/../g).map(h => parseInt(h, 16)));
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: p.iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  async function decrypt(file) {
    const buf = await (await fetch(file)).arrayBuffer();
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(buf, 0, 12) }, key, new Uint8Array(buf, 12));
  }

  async function download() {
    const data = await decrypt('pages.enc');
    const url = URL.createObjectURL(new Blob([data], { type: 'application/pdf' }));
    const a = document.createElement('a'); a.href = url; a.download = 'venus-berlin-26-zine-clare-carmody.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    go.disabled = true; msg.className = 'msg'; msg.textContent = 'Unlocking\u2026';
    try {
      key = await deriveKey(pw.value);
      await openZine(true);
      form.hidden = true;
      document.getElementById('done').hidden = false;
    } catch (err) {
      key = null;
      msg.className = 'msg err';
      msg.textContent = (err && err.name === 'OperationError') ? "That password didn't work. Check it and try again." : "The zine couldn't load. Check your connection and try again.";
      pw.select();
    } finally { go.disabled = false; }
  });

  let zineUrl = null;
  async function openZine(checkOnly) {
    if (!zineUrl) {
      const html = new TextDecoder().decode(await decrypt('zine.enc'));
      zineUrl = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    }
    if (checkOnly) return;
    document.getElementById('zine').src = zineUrl;
    document.getElementById('gate').hidden = true;
    document.getElementById('reader').hidden = false;
  }
  const dlBtn = (btn) => btn.addEventListener('click', async () => {
    const label = btn.textContent; btn.disabled = true; btn.textContent = 'Preparing\u2026';
    try { await download(); btn.textContent = label; }
    catch (e) { btn.textContent = 'Download failed, try again'; setTimeout(() => btn.textContent = label, 3000); }
    finally { btn.disabled = false; }
  });
  dlBtn(document.getElementById('dl')); dlBtn(document.getElementById('dl2'));
  document.getElementById('read').addEventListener('click', () => openZine(false));
})();
</script>
</body>
</html>
